id: SYS-DEGREE-AI-REVIEW
name: '智慧学位 AI 评阅辅助系统（ARC 可实现版）'
type: MODULE
description: '面向学生、导师、学院管理人员和学校管理人员，建设一个可在当前 ARC Web 模板中完整生成、运行和测试的学位论文辅助系统。\n系统采用单端口 B/S 架构，前端使用 React，后端使用 Express，业务数据使用 SQLite 持久化。系统在本地单实例中运行，不承诺微服务拆分、校内私有云部署、高并发或弹性扩容。\n除明确标注的 review-pilot PDF 语义规则外，核心结果由本地可解释的规则、公式和持久化数据产生，不依赖 jAccount、短信、微信、外部大模型、校外文献库或未提供的校内论文库。语义规则固定调用 DeepSeek 官方 API，只处理规则选中的摘要、论点和候选论据文本，其结果属于需人工复核的辅助判断。'
images:
  - label: '系统图标'
    path: './reference/image-001.jpeg'
  - label: '系统架构'
    path: './reference/image-002.png'
roles:
  - id: 'STUDENT'
    name: '学生'
  - id: 'SUPERVISOR'
    name: '导师'
  - id: 'SCHOOL_ADMIN'
    name: '学校管理人员'
  - id: 'COLLEGE_ADMIN'
    name: '学院管理人员'
dependencies: []
children:
  - id: MOD-UNIFIED-WORKBENCH
    name: '业务功能与历史一体化'
    type: MODULE
    description: '规范性检测、论文相似度检测、论文润色、创新性量表评估和规则化辅助评阅在侧边栏中各保留一个模块入口。用户进入模块后，通过同一页面区域内的页签切换发起功能和历史记录；论文润色提供整篇润色、局部润色和润色记录三个页签。报告详情可以保留独立 URL，旧历史地址继续可访问，切换到历史页或详情页时侧边栏仍高亮所属业务模块。\nPDF 规则审查完成后保存为个人 PDF 检测报告，用户可在历史报告中继续查看检测结论、问题、原文定位和修改建议；原有纯文本规范检测记录仍以独立类型展示。'
    permissions: ALL
    dependencies: []
    children:
      - id: FEAT-UNIFIED-MODULE-HISTORY
        name: '功能与历史模块页签'
        type: FEATURE
        description: '模块页签只改变前端信息架构，不放宽后端的数据权限和角色范围。历史记录仍按各业务原有规则加载，报告详情链接保持可刷新和可返回。'
        permissions: ALL
        dependencies: []
        scenarios:
          - name: '在同一业务模块切换发起功能和历史'
            actor: 'STUDENT'
            steps:
              - keyword: GIVEN
                actor: 'STUDENT'
                content: 'student01 已登录并进入论文相似度检测。'
              - keyword: WHEN
                actor: 'STUDENT'
                content: '学生点击“历史记录”页签。'
              - keyword: THEN
                content: '系统仍将侧边栏“论文相似度检测”标记为当前模块，并仅显示 student01 的历史记录。'
          - name: '合并论文润色入口'
            actor: 'STUDENT'
            steps:
              - keyword: GIVEN
                actor: 'STUDENT'
                content: 'student01 已登录。'
              - keyword: WHEN
                actor: 'STUDENT'
                content: '学生从侧边栏进入“论文润色”。'
              - keyword: THEN
                content: '页面提供整篇润色、局部润色和润色记录三个页签，侧边栏不再重复展示三个独立入口。'
  - id: MOD-AUTH
    name: '本地身份认证与会话'
    type: MODULE
    description: '使用本地 SQLite 用户、密码哈希和服务端会话完成认证。系统提供四类可测试角色账号，并在本地数据中保存学生—导师—学院的组织关系。\njAccount、短信验证码、交我办和微信扫码不属于本版本实现与验收范围。'
    images:
      - label: '统一身份认证界面参考'
        path: './reference/image-003.png'
    permissions: ALL
    dependencies: []
    children:
      - id: FEAT-AUTH-SESSION
        name: '本地用户、组织关系与会话'
        type: FEATURE
        description: '系统首次启动时幂等创建四个演示账号：student01、supervisor01、college_admin01、school_admin01，初始密码均为 ArcDemo123!，密码必须使用 bcrypt 哈希保存。\nstudent01 属于 college01，导师为 supervisor01；supervisor01 和 college_admin01 属于 college01；school_admin01 拥有全校范围。\n后端提供登录会话、当前用户、退出登录接口。会话通过 HttpOnly、SameSite=Lax Cookie 保持，受限 API 必须在服务端校验会话、角色和数据范围。'
        permissions: ALL
        dependencies: []
        scenarios:
          - name: '恢复已登录会话'
            actor: 'STUDENT'
            steps:
              - keyword: GIVEN
                actor: 'STUDENT'
                content: 'student01 已使用有效账号建立会话。'
              - keyword: WHEN
                actor: 'STUDENT'
                content: '用户刷新页面或请求当前用户接口。'
              - keyword: THEN
                content: '系统从服务端会话恢复 student01、STUDENT 角色、college01 和 supervisor01 关系。'
          - name: '拒绝未登录访问'
            actor: 'STUDENT'
            steps:
              - keyword: GIVEN
                actor: 'STUDENT'
                content: '浏览器不存在有效会话。'
              - keyword: WHEN
                actor: 'STUDENT'
                content: '用户请求任一受限业务 API。'
              - keyword: THEN
                content: '后端返回 401，不返回业务数据。'
      - id: FEAT-AUTH-PASSWORD
        name: '本地账号密码登录'
        type: FEATURE
        description: '用户输入本地用户名和密码登录。登录成功后进入系统首页，并根据当前角色显示菜单和数据范围。登录失败仅显示统一错误提示，不泄露用户名是否存在。'
        permissions: ALL
        dependencies:
          - 'FEAT-AUTH-SESSION'
        scenarios:
          - name: '使用本地账号成功登录'
            actor: 'STUDENT'
            steps:
              - keyword: GIVEN
                actor: 'STUDENT'
                content: '用户位于登录页，输入 student01 和 ArcDemo123!。'
              - keyword: WHEN
                actor: 'STUDENT'
                content: '用户提交登录表单。'
              - keyword: THEN
                content: '系统建立 HttpOnly Cookie 会话，进入首页并显示学生菜单。'
          - name: '拒绝错误密码'
            actor: 'STUDENT'
            steps:
              - keyword: GIVEN
                actor: 'STUDENT'
                content: '用户输入 student01 和错误密码。'
              - keyword: WHEN
                actor: 'STUDENT'
                content: '用户提交登录表单。'
              - keyword: THEN
                content: '系统不建立会话，显示“用户名或密码错误”。'
      - id: FEAT-AUTH-HELP
        name: '本地登录帮助'
        type: FEATURE
        description: '登录页提供“演示账号与登录帮助”入口，展示四个演示账号、角色、初始密码和本地原型说明。页面明确说明本版本未接入 jAccount、短信或扫码登录。'
        permissions: ALL
        dependencies:
          - 'FEAT-AUTH-PASSWORD'
        scenarios:
          - name: '查看演示账号'
            actor: 'STUDENT'
            steps:
              - keyword: GIVEN
                actor: 'STUDENT'
                content: '用户位于登录页。'
              - keyword: WHEN
                actor: 'STUDENT'
                content: '用户打开演示账号帮助。'
              - keyword: THEN
                content: '页面展示四类账号及本地原型能力边界。'
  - id: MOD-NORMATIVE-DETECTION
    name: '论文规则化规范检测'
    type: MODULE
    description: '模块保留原有纯文本规范检测与历史报告能力，同时在 `/normative-check` 提供 review-pilot PDF 规则审查试点入口。PDF 入口把原文件临时交给同机规则引擎，返回可解释的规则状态、问题和页面坐标，并在浏览器中显示原 PDF 与高亮；原始 PDF 和本次快速审查结果不写入当前 SQLite，处理完成后删除后端临时文件。\nPDF 入口默认启用 11 条不调用外部模型的确定性规则，并提供 3 条默认不勾选的 DeepSeek 语义规则；语义规则只发送规则选中的相关文本，结果必须人工复核。原有纯文本规则、学校/学院规则发布及检测台账保持独立，不自动作用于 review-pilot 规则目录。'
    permissions: ALL
    dependencies: []
    children:
      - id: FEAT-NORMATIVE-FORMAT-RULES
        name: '默认规范检测规则'
        type: FEATURE
        description: '系统内置以下可执行规则：\n- 章节顺序：摘要、关键词、引言、结论、参考文献必须出现，且按该顺序排列。\n- 标点配对：检查中英文圆括号、方括号、书名号和引号是否成对。\n- 重复标点：报告“，，”“。。”“；；”和连续三个以上相同标点。\n- 日期格式：数字日期仅接受 YYYY-MM-DD，例如 2026-08-03。\n- 参考文献：“参考文献”后的非空行必须以 [1] 开始并连续递增。\n- 文本质量：报告连续重复词、Tab、行尾空格、超过 120 个字符的句子，以及规则表中的禁用词。\n每条问题输出 rule_id、类别、严重程度、行号、列号、原文片段、问题说明和修改建议。'
        permissions: ALL
        dependencies:
          - 'FEAT-AUTH-SESSION'
        scenarios:
          - name: '检出可重复的文本问题'
            actor: 'STUDENT'
            steps:
              - keyword: GIVEN
                actor: 'STUDENT'
                content: '文本包含未配对括号、“。。”和一个超过 120 字符的句子。'
              - keyword: WHEN
                actor: 'STUDENT'
                content: '学生对该文本运行默认规则。'
              - keyword: THEN
                content: '系统分别返回配对、重复标点和过长句问题，且每条问题包含行列位置。'
      - id: FEAT-REVIEW-PILOT-PDF-LINT
        name: 'review-pilot PDF 规则审查'
        type: FEATURE
        description: '所有已登录角色可在 `/normative-check` 上传不超过 50 MB 的 PDF，从部署环境提供的规则目录中选择检查项并同步运行。后端校验 PDF 文件头，以权限受限的临时文件调用同机 Python 规则引擎，限制并发数和单次运行时间，并在成功或失败后删除临时文件。\n结果展示论文标题、规则执行状态和问题汇总；存在页面坐标的问题在内嵌 PDF 中高亮，点击问题或证据锚点时联动定位。系统默认启用 11 条确定性规则，并提供 3 条默认不勾选、需明确外部处理同意的扩展分析检查项。\n原始 PDF 不写入 SQLite 二进制字段；成功检测后，系统将报告数据和原文定位所需 PDF 副本保存到应用专用目录，并仅通过后端登录权限向报告创建者提供。PDF 报告进入个人检测历史，但不自动进入现有文本检测台账、统计或师生批阅闭环。扩展分析输出可能不稳定或无法判定，不得表述为专家结论，必须由人工复核。扫描版、加密 PDF 或缺少规则所需结构时，规则可返回不适用、无法判定或可理解的错误。'
        permissions: ALL
        dependencies:
          - 'FEAT-AUTH-SESSION'
        scenarios:
          - name: '运行 PDF 规则并联动定位'
            actor: 'STUDENT'
            steps:
              - keyword: GIVEN
                actor: 'STUDENT'
                content: 'student01 已登录，选择一份有效 PDF 和至少一条确定性规则。'
              - keyword: WHEN
                actor: 'STUDENT'
                content: '学生发起规则审查。'
              - keyword: THEN
                content: '系统返回真实规则执行状态和问题；带 PDF 坐标的问题可在原文中高亮并通过问题列表定位。'
          - name: '拒绝无效输入且不保留临时文件'
            actor: 'STUDENT'
            steps:
              - keyword: GIVEN
                actor: 'STUDENT'
                content: '上传内容不是 PDF、超过 50 MB，或没有选择规则。'
              - keyword: WHEN
                actor: 'STUDENT'
                content: '学生发起规则审查。'
              - keyword: THEN
                content: '系统返回可理解的校验错误，不生成虚假结果，也不在 SQLite 或临时目录中保留审查记录。'
          - name: '按需运行语义规则并说明外部处理边界'
            actor: 'STUDENT'
            steps:
              - keyword: GIVEN
                actor: 'STUDENT'
                content: 'DeepSeek 官方 API Key 已由服务器安全配置，学生选择至少一条标记为“DeepSeek 语义”的规则。'
              - keyword: WHEN
                actor: 'STUDENT'
                content: '学生确认论文允许外发并发起审查。'
              - keyword: THEN
                content: '系统只把该规则选中的摘要、论点和候选论据文本发送至固定模型，返回真实的通过、问题、无法判定或执行失败状态，并提示结果需要人工复核。'
          - name: '密钥未配置时不伪造语义结果'
            actor: 'SCHOOL_ADMIN'
            steps:
              - keyword: GIVEN
                actor: 'SCHOOL_ADMIN'
                content: '服务器没有配置 DeepSeek 官方 API Key。'
              - keyword: WHEN
                actor: 'SCHOOL_ADMIN'
                content: '管理员查看规则目录或尝试选择语义规则。'
              - keyword: THEN
                content: '语义规则明确显示为尚未配置且不可选择，确定性规则仍可正常运行，系统不使用假密钥或伪造语义结果。'
      - id: FEAT-BUILT-IN-REVIEW-CASES
        name: '内置审查案例'
        type: FEATURE
        description: '所有已登录角色可从独立的“内置审查案例”模块查看随系统版本提供的固定 PDF 与确定性案例结果。案例包括同一论文中 Yandex 准确率 `80.0%` 的论点与实验章节 `60.5%` 的论据冲突，以及中文摘要遥感影像分割与英文摘要验证码识别的研究内容不一致；结果包含修改建议和 PDF 原文坐标。案例不写入 SQLite，不进入检测历史、统计或师生批阅闭环。'
        permissions: ALL
        dependencies:
          - 'FEAT-AUTH-SESSION'
          - 'FEAT-REVIEW-PILOT-PDF-LINT'
        scenarios:
          - name: '查看固定案例并跨页定位'
            actor: 'STUDENT'
            steps:
              - keyword: GIVEN
                actor: 'STUDENT'
                content: 'student01 已登录并进入内置审查案例模块。'
              - keyword: WHEN
                actor: 'STUDENT'
                content: '学生打开“跨页数值论点与实验论据不一致”案例，并分别点击论点和论据锚点。'
              - keyword: THEN
                content: '系统展示固定的一项审查问题和修改建议，并将 PDF 依次定位到第 22 页的 `80.0%` 论点与第 57 页的 `60.5%` 论据。'
          - name: '查看中英文摘要内容不一致'
            actor: 'STUDENT'
            steps:
              - keyword: GIVEN
                actor: 'STUDENT'
                content: 'student01 已登录并进入内置审查案例模块。'
              - keyword: WHEN
                actor: 'STUDENT'
                content: '学生打开“中英文摘要研究内容不一致”案例，并分别点击中文摘要和英文摘要锚点。'
              - keyword: THEN
                content: '系统展示固定的一项摘要内容不一致问题，并将 PDF 定位到第 7 页中文摘要与第 9 页英文摘要。'
          - name: '拒绝匿名读取案例资源'
            actor: 'STUDENT'
            steps:
              - keyword: GIVEN
                actor: 'STUDENT'
                content: '浏览器不存在有效会话。'
              - keyword: WHEN
                actor: 'STUDENT'
                content: '用户直接请求案例目录、案例详情或案例 PDF。'
              - keyword: THEN
                content: '后端返回 401，不返回案例内容或 PDF 文件。'
      - id: FLOW-RULE-PUBLISH
        name: '学校与学院规则配置'
        type: WORKFLOW
        description: '规则包含 rule_id、标题、类别、严重程度、启用状态、匹配参数和提示文案。\n学校管理人员维护全校默认规则，学院管理人员仅维护本学院规则。同一 rule_id 的合并顺序为国标默认值 < 学校规则 < 学院规则；学院重置后删除学院覆盖并继承学校值。'
        images:
          - label: '模板历史、模板上传与可视化规则配置界面'
            path: './reference/image-052.png'
        permissions:
          - 'SCHOOL_ADMIN'
          - 'COLLEGE_ADMIN'
        dependencies:
          - 'FEAT-NORMATIVE-FORMAT-RULES'
        scenarios:
          - name: '学院规则覆盖学校规则'
            actor: 'COLLEGE_ADMIN'
            steps:
              - keyword: GIVEN
                actor: 'COLLEGE_ADMIN'
                content: '学校已发布 rule_id 为 TEXT-LONG-SENTENCE 的 120 字符阈值。'
              - keyword: WHEN
                actor: 'COLLEGE_ADMIN'
                content: 'college01 管理员将同一规则改为 100 字符并提交生效。'
              - keyword: THEN
                content: 'college01 学生检测使用 100，其他学院仍使用 120。'
          - name: '拒绝跨学院修改'
            actor: 'COLLEGE_ADMIN'
            steps:
              - keyword: GIVEN
                actor: 'COLLEGE_ADMIN'
                content: 'college_admin01 属于 college01。'
              - keyword: WHEN
                actor: 'COLLEGE_ADMIN'
                content: '该用户尝试修改 college02 的规则。'
              - keyword: THEN
                content: '后端返回 403，且 college02 规则不变。'
      - id: FEAT-RULE-TEMPLATE-UPLOAD
        name: 'JSON 规则集导入'
        type: FEATURE
        description: '学校或学院管理人员上传不超过 1 MB 的 UTF-8 JSON 文件导入规则草稿。顶层必须为数组，每项必须包含 rule_id、title、category、severity、enabled 和 message，可选 params。\n导入仅保存草稿，不自动生效；不支持从 DOC/DOCX 模板自动推导规则。'
        permissions:
          - 'SCHOOL_ADMIN'
          - 'COLLEGE_ADMIN'
        dependencies:
          - 'FLOW-RULE-PUBLISH'
        scenarios:
          - name: '导入合法规则集'
            actor: 'SCHOOL_ADMIN'
            steps:
              - keyword: GIVEN
                actor: 'SCHOOL_ADMIN'
                content: '管理员准备了包含两条完整规则的 JSON 数组。'
              - keyword: WHEN
                actor: 'SCHOOL_ADMIN'
                content: '管理员导入文件。'
              - keyword: THEN
                content: '系统校验字段并创建两条草稿，不改变已生效规则。'
          - name: '拒绝非法 JSON 规则集'
            actor: 'COLLEGE_ADMIN'
            steps:
              - keyword: GIVEN
                actor: 'COLLEGE_ADMIN'
                content: 'JSON 项缺少 rule_id 或 severity 不在严重、一般、轻微之中。'
              - keyword: WHEN
                actor: 'COLLEGE_ADMIN'
                content: '管理员导入文件。'
              - keyword: THEN
                content: '系统显示具体项索引和错误原因，不保存任何项。'
      - id: FEAT-NORMATIVE-DETECT
        name: '发起规范检测'
        type: FEATURE
        description: '学生可粘贴论文文本或上传 .txt/.md/含可搜索文字层的 PDF 文件，选择当前生效的学校/学院规则后发起检测。\n任务状态按“待检测→检测中→已完成”流转，检测在同一后端请求内完成，不伪造百分比进度。系统保存提取后的原文、原文件名、规则快照、问题列表、各级别计数和创建时间，不保存原始 PDF。'
        images:
          - label: '规范性检测文件上传与规则选择界面'
            path: './reference/image-004.png'
          - label: '规范性检测进度与结果汇总界面'
            path: './reference/image-005.png'
        permissions: ALL
        dependencies:
          - 'FEAT-AUTH-SESSION'
          - 'FEAT-NORMATIVE-FORMAT-RULES'
          - 'FLOW-RULE-PUBLISH'
        scenarios:
          - name: '对粘贴文本完成检测'
            actor: 'STUDENT'
            steps:
              - keyword: GIVEN
                actor: 'STUDENT'
                content: 'student01 粘贴了包含摘要、关键词、引言、结论和参考文献的文本。'
              - keyword: WHEN
                actor: 'STUDENT'
                content: '学生发起检测。'
              - keyword: THEN
                content: '系统保存已完成任务、当次规则快照和带行列位置的问题列表。'
          - name: '拒绝超限或不可提取文件'
            actor: 'STUDENT'
            steps:
              - keyword: GIVEN
                actor: 'STUDENT'
                content: '文本文件超过 50 MB、PDF 原文件超过 50 MB、PDF 提取文本超过 50 MB、文本文件无法按 UTF-8 解码，或 PDF 不含可搜索文字层。'
              - keyword: WHEN
                actor: 'STUDENT'
                content: '学生上传文件。'
              - keyword: THEN
                content: '系统返回可理解的校验错误，不创建检测任务。'
      - id: FEAT-NORMATIVE-REPORT
        name: '规范检测记录与报告'
        type: FEATURE
        description: '学生仅查看本人的历史记录。列表按创建时间倒序展示文档名、问题总数、严重/一般/轻微计数和检测时间。\n报告页左侧显示带行号的纯文本，右侧显示问题列表；点击问题后滚动到对应行并高亮文本片段。支持下载 UTF-8 JSON 报告和使用浏览器打印页面。'
        images:
          - label: '规范性检测历史记录与报告操作'
            path: './reference/image-006.png'
        permissions: ALL
        dependencies:
          - 'FEAT-NORMATIVE-DETECT'
        scenarios:
          - name: '定位并导出检测问题'
            actor: 'STUDENT'
            steps:
              - keyword: GIVEN
                actor: 'STUDENT'
                content: 'student01 拥有一份包含行列位置的已完成报告。'
              - keyword: WHEN
                actor: 'STUDENT'
                content: '学生打开报告、点击一条问题并下载 JSON。'
              - keyword: THEN
                content: '原文滚动到对应行并高亮，下载文件包含规则快照和完整问题列表。'
  - id: MOD-DUPLICATION-CHECK
    name: '本地文本相似度与写作风险检测'
    type: MODULE
    description: '对纯文本执行本地可解释检测。“校内相似度”仅与学校管理人员已导入的本地样本库比对；“写作风险”仅根据重复率、句长分布和模板短语密度输出风险提示，不声称识别 AI 生成真伪。'
    permissions: ALL
    dependencies: []
    children:
      - id: FEAT-DUPLICATION-CORPUS
        name: '本地比对样本库'
        type: FEATURE
        description: '学校管理人员可通过粘贴文本或上传 .txt/.md/含可搜索文字层的 PDF 文件新增样本，填写标题、学科和年份，并可查看或删除样本。\n样本保存于 SQLite，仅保存提取后的文本和原文件名，不保存原始 PDF，也不表示已接入真实校内论文库。'
        permissions:
          - 'SCHOOL_ADMIN'
        dependencies:
          - 'FEAT-AUTH-SESSION'
        scenarios:
          - name: '导入本地比对样本'
            actor: 'SCHOOL_ADMIN'
            steps:
              - keyword: GIVEN
                actor: 'SCHOOL_ADMIN'
                content: 'school_admin01 准备了一份非空 UTF-8 文本及标题、学科和年份。'
              - keyword: WHEN
                actor: 'SCHOOL_ADMIN'
                content: '管理员提交样本。'
              - keyword: THEN
                content: '系统保存样本，并在后续相似度检测中使用它。'
      - id: FEAT-DUPLICATION-DETECT
        name: '发起本地相似度与风险检测'
        type: FEATURE
        description: '系统对文本进行小写化、空白归一化和标点移除，以字符 5-gram 集合计算 Jaccard 相似度，返回最高的五个样本及相似段落。总相似率为所有命中段落字符数去重后除以待检文本有效字符数，比对阈值默认为 0.65。\n写作风险分由段落重复率 35%、句长变化不足 25%、模板连接词密度 20%和空泛短语密度 20% 加权生成。页面必须显示该分数是启发式风险而非 AI 真伪结论。'
        images:
          - label: '论文查重类型选择与文件上传界面'
            path: './reference/image-008.png'
          - label: '论文查重进度界面'
            path: './reference/image-009.png'
        permissions: ALL
        dependencies:
          - 'FEAT-AUTH-SESSION'
          - 'FEAT-DUPLICATION-CORPUS'
        scenarios:
          - name: '检出本地样本相似段落'
            actor: 'STUDENT'
            steps:
              - keyword: GIVEN
                actor: 'STUDENT'
                content: '本地样本库已有一篇文本，待检文本包含与其高度相似的段落。'
              - keyword: WHEN
                actor: 'STUDENT'
                content: 'student01 发起相似度检测。'
              - keyword: THEN
                content: '报告显示命中样本、Jaccard 分数、相似段落和总相似率。'
          - name: '无样本时返回明确结果'
            actor: 'STUDENT'
            steps:
              - keyword: GIVEN
                actor: 'STUDENT'
                content: '本地样本库为空。'
              - keyword: WHEN
                actor: 'STUDENT'
                content: 'student01 发起检测。'
              - keyword: THEN
                content: '系统完成写作风险计算，并将相似度结果标记为“无可用样本”，不伪造比对结果。'
      - id: FEAT-DUPLICATION-HISTORY
        name: '相似度与写作风险记录'
        type: FEATURE
        description: '学生查看本人检测历史，包含文档名、总相似率、写作风险分、样本库数量和检测时间。报告支持在线查看、JSON 下载和浏览器打印。'
        images:
          - label: '论文查重历史记录与报告操作'
            path: './reference/image-010.png'
        permissions: ALL
        dependencies:
          - 'FEAT-DUPLICATION-DETECT'
        scenarios:
          - name: '查看检测历史'
            actor: 'STUDENT'
            steps:
              - keyword: GIVEN
                actor: 'STUDENT'
                content: 'student01 已完成两次检测。'
              - keyword: WHEN
                actor: 'STUDENT'
                content: '学生打开历史记录。'
              - keyword: THEN
                content: '系统仅按时间倒序显示 student01 的两条记录，并可打开完整报告。'
  - id: MOD-POLISH
    name: '规则化文本润色'
    type: MODULE
    description: '使用本地确定性规则修正空白、标点、重复词和可配置短语，并用差异视图展示每处变更。\n本版本不调用外部大模型，不声称进行语义重构，不生成 Word 原生修订痕迹。'
    permissions: ALL
    dependencies: []
    children:
      - id: FEAT-POLISH-WHOLE
        name: '全文规则润色'
        type: FEATURE
        description: '支持粘贴文本或上传 .txt/.md/含可搜索文字层的 PDF，提供三档可解释处理：\n- 基础校准：去除行尾空格、归一化连续空白、修复重复标点和连续重复词。\n- 标准优化：在基础校准上，应用管理员维护的“原短语→替换短语”映射。\n- 增强优化：在标准优化上，对超过 120 字符且包含分号或逗号的句子按首个合法分隔位置拆分，并记录拆分原因。\n结果保存原文、新文、档位和变更列表，可下载 UTF-8 .txt 结果。'
        images:
          - label: '全文润色文档上传与三档等级选择'
            path: './reference/image-018.png'
          - label: '全文润色完成信息与结果操作'
            path: './reference/image-019.png'
          - label: '带 Word 修订痕迹的润色输出'
            path: './reference/image-021.png'
        permissions: ALL
        dependencies:
          - 'FEAT-AUTH-SESSION'
        scenarios:
          - name: '生成可追溯全文润色结果'
            actor: 'STUDENT'
            steps:
              - keyword: GIVEN
                actor: 'STUDENT'
                content: '文本包含重复标点、重复词和一个已配置的短语。'
              - keyword: WHEN
                actor: 'STUDENT'
                content: 'student01 选择标准优化并执行。'
              - keyword: THEN
                content: '系统生成确定的新文和变更列表，每条变更包含原文、新文、位置和规则。'
      - id: FEAT-POLISH-LOCAL
        name: '局部文本润色与差异对比'
        type: FEATURE
        description: '页面左右分栏展示原文和结果，支持选择档位、处理、复制结果、重置和重试。相同原文、档位和规则版本的重试必须产生相同结果。'
        images:
          - label: '局部文本左右分栏润色界面'
            path: './reference/image-022.png'
        permissions: ALL
        dependencies:
          - 'FEAT-POLISH-WHOLE'
        scenarios:
          - name: '重试产生相同结果'
            actor: 'STUDENT'
            steps:
              - keyword: GIVEN
                actor: 'STUDENT'
                content: '学生已用标准优化处理一段文本，规则版本未变。'
              - keyword: WHEN
                actor: 'STUDENT'
                content: '学生点击重试。'
              - keyword: THEN
                content: '新结果和变更列表与上一次完全一致。'
      - id: FEAT-POLISH-HISTORY
        name: '润色历史记录'
        type: FEATURE
        description: '学生查看本人全文与局部润色记录，按时间倒序显示名称、档位、变更数和生成时间，并可查看差异或下载 .txt 结果。'
        images:
          - label: '全文润色历史记录'
            path: './reference/image-020.png'
        permissions: ALL
        dependencies:
          - 'FEAT-POLISH-LOCAL'
        scenarios:
          - name: '查看本人润色记录'
            actor: 'STUDENT'
            steps:
              - keyword: GIVEN
                actor: 'STUDENT'
                content: 'student01 和另一学生都有润色记录。'
              - keyword: WHEN
                actor: 'STUDENT'
                content: 'student01 打开历史页。'
              - keyword: THEN
                content: '页面仅展示 student01 的记录。'
  - id: MOD-INNOVATION-ANALYSIS
    name: '创新性量表评估'
    type: MODULE
    description: '通过用户填写的五维度等级和证据文本生成透明可解释的创新性自评结果。系统不搜索国内外文献，不访问往届论文库，不声称自动发现学术创新。'
    permissions: ALL
    dependencies: []
    children:
      - id: FEAT-INNOVATION-SCORING-MODEL
        name: '固定透明评分模型'
        type: FEATURE
        description: '五个维度为研究选题、研究方法、研究内容、研究结论和应用价值。每个维度由用户选择 1-5 级，维度原始分=等级×20。\n博士权重依次为 25%、25%、20%、20%、10%；硕士权重依次为 20%、20%、25%、20%、15%。综合分=各维度原始分×权重之和。\n90-100 为优秀，80-89.99 为良好，60-79.99 为一般，0-59.99 为待提升。公式和本次输入必须在报告中展示。'
        permissions: ALL
        dependencies:
          - 'FEAT-AUTH-SESSION'
        scenarios:
          - name: '按硕士权重计算综合分'
            actor: 'STUDENT'
            steps:
              - keyword: GIVEN
                actor: 'STUDENT'
                content: '硕士论文五维度等级依次为 5、4、4、3、4。'
              - keyword: WHEN
                actor: 'STUDENT'
                content: '系统计算创新性分数。'
              - keyword: THEN
                content: '系统按 20%、20%、25%、20%、15% 权重返回 80 分和“良好”等级。'
      - id: FEAT-INNOVATION-ANALYZE
        name: '发起创新性量表评估'
        type: FEATURE
        description: '学生填写论文题目、学历层次、学科、研究方向，并为每个维度选择 1-5 级、填写不少于 20 个字符的证据和改进计划。\n系统校验所有字段，按固定公式计算分数并保存快照。页面明确标记“本结果为量表自评，不代替专家评审或文献查新”。'
        images:
          - label: '创新性分析上传信息界面'
            path: './reference/image-023.png'
          - label: '创新性分析处理进度'
            path: './reference/image-024.png'
          - label: '创新性分析完成结果操作'
            path: './reference/image-025.png'
        permissions: ALL
        dependencies:
          - 'FEAT-INNOVATION-SCORING-MODEL'
        scenarios:
          - name: '完成五维度评估'
            actor: 'STUDENT'
            steps:
              - keyword: GIVEN
                actor: 'STUDENT'
                content: 'student01 已填写完整的基本信息、五维度等级、证据和改进计划。'
              - keyword: WHEN
                actor: 'STUDENT'
                content: '学生提交评估。'
              - keyword: THEN
                content: '系统保存输入快照、权重、分项分、综合分和等级。'
          - name: '拒绝缺失维度证据'
            actor: 'STUDENT'
            steps:
              - keyword: GIVEN
                actor: 'STUDENT'
                content: '研究方法维度证据少于 20 个字符。'
              - keyword: WHEN
                actor: 'STUDENT'
                content: '学生提交评估。'
              - keyword: THEN
                content: '系统指出研究方法证据不完整，不保存评估。'
      - id: FEAT-INNOVATION-REPORT
        name: '创新性量表报告'
        type: FEATURE
        description: '报告显示基本信息、五维雷达图、五维评级热力矩阵、证据、改进计划、权重公式、综合分和声明。图表使用本地 SVG 或 CSS 绘制，不依赖外部图表服务。支持 JSON 下载和浏览器打印。'
        images:
          - label: '创新性分析报告基本信息'
            path: './reference/image-027.png'
        permissions: ALL
        dependencies:
          - 'FEAT-INNOVATION-ANALYZE'
        scenarios:
          - name: '展示透明评分报告'
            actor: 'STUDENT'
            steps:
              - keyword: GIVEN
                actor: 'STUDENT'
                content: 'student01 有一份已完成评估。'
              - keyword: WHEN
                actor: 'STUDENT'
                content: '学生打开报告。'
              - keyword: THEN
                content: '页面以文本和图表展示五维分数、证据、权重和综合分，且两种表示的数值一致。'
      - id: FEAT-INNOVATION-HISTORY
        name: '创新性评估历史'
        type: FEATURE
        description: '学生仅查看本人评估，按时间倒序显示论文题目、学历层次、综合分、等级和生成时间。'
        images:
          - label: '创新性分析历史记录'
            path: './reference/image-026.png'
        permissions: ALL
        dependencies:
          - 'FEAT-INNOVATION-REPORT'
        scenarios:
          - name: '查看创新性评估历史'
            actor: 'STUDENT'
            steps:
              - keyword: GIVEN
                actor: 'STUDENT'
                content: 'student01 已完成多次评估。'
              - keyword: WHEN
                actor: 'STUDENT'
                content: '学生打开历史页。'
              - keyword: THEN
                content: '系统按时间倒序显示本人记录，并可进入对应报告。'
  - id: MOD-AI-REVIEW
    name: '规则化论文辅助评阅'
    type: MODULE
    description: '基于固定评阅模板和可验证的文本特征生成辅助检查结果。系统检查章节、篇幅、参考文献数量、方法与结论章节及规范问题，主观学术质量统一标记为“待人工确认”。\n本版本不调用外部大模型，不产生专家级学术结论。'
    permissions: ALL
    dependencies: []
    children:
      - id: FEAT-AI-REVIEW-RUBRICS
        name: '评阅模板与客观检查项'
        type: FEATURE
        description: '系统内置学术型博士自然科学、学术型博士人文社科、专业型博士、学术型硕士和专业型硕士五类模板。\n每类模板定义必需章节和最低参考文献数量；共享客观分值为章节完整性 30 分、参考文献数量与编号 20 分、研究方法章节 20 分、结论章节 20 分、规范检测结果 10 分。\n客观分不低于 80 且无必需章节缺失时结果为“基础检查通过”，否则为“需修改”。'
        permissions: ALL
        dependencies:
          - 'FEAT-AUTH-SESSION'
          - 'FEAT-NORMATIVE-FORMAT-RULES'
        scenarios:
          - name: '显示五类评阅模板'
            actor: 'STUDENT'
            steps:
              - keyword: GIVEN
                actor: 'STUDENT'
                content: '用户进入辅助评阅页。'
              - keyword: WHEN
                actor: 'STUDENT'
                content: '用户打开模板选择器。'
              - keyword: THEN
                content: '系统展示五类模板及各自的必需章节、最低文献数和共享计分项。'
      - id: FEAT-AI-REVIEW-RUN
        name: '发起规则化辅助评阅'
        type: FEATURE
        description: '用户选择评阅模板，填写论文题目，并粘贴或上传 .txt/.md/含可搜索文字层的 PDF 论文文本。系统按标题行和关键词识别章节，统计字符数与参考文献条目，复用规范检测规则，并按模板公式生成结果。PDF 仅保存提取后的文本和原文件名。'
        images:
          - label: 'AI 智能评阅模板选择与论文上传'
            path: './reference/image-032.png'
        permissions: ALL
        dependencies:
          - 'FEAT-AI-REVIEW-RUBRICS'
        scenarios:
          - name: '对章节不完整文本给出需修改结果'
            actor: 'STUDENT'
            steps:
              - keyword: GIVEN
                actor: 'STUDENT'
                content: '论文缺少所选模板规定的结论章节。'
              - keyword: WHEN
                actor: 'STUDENT'
                content: 'student01 发起辅助评阅。'
              - keyword: THEN
                content: '系统将结论章节项计为 0 分，整体结果为“需修改”，并指出缺失章节。'
      - id: FEAT-AI-REVIEW-RESULT
        name: '辅助评阅结果'
        type: FEATURE
        description: '结果页展示论文基本信息、模板、五项客观分、总分、通过/需修改结论、规范问题和“待人工确认”的主观维度清单。\n页面左侧使用带行号的纯文本预览，右侧显示检查项，支持 JSON 下载和浏览器打印。'
        images:
          - label: '论文原文与 AI 智能评阅结果双栏页'
            path: './reference/image-033.png'
        permissions: ALL
        dependencies:
          - 'FEAT-AI-REVIEW-RUN'
        scenarios:
          - name: '核对评分项和总分'
            actor: 'STUDENT'
            steps:
              - keyword: GIVEN
                actor: 'STUDENT'
                content: '一份辅助评阅已完成。'
              - keyword: WHEN
                actor: 'STUDENT'
                content: '学生打开结果页。'
              - keyword: THEN
                content: '五项分数之和等于总分，且主观学术维度均显示为待人工确认。'
      - id: FEAT-AI-REVIEW-HISTORY
        name: '辅助评阅历史'
        type: FEATURE
        description: '学生仅查看本人历史，按时间倒序显示论文题目、模板、总分、结论和时间，并可进入结果页。'
        images:
          - label: 'AI 智能评阅历史记录'
            path: './reference/image-034.png'
        permissions: ALL
        dependencies:
          - 'FEAT-AI-REVIEW-RESULT'
        scenarios:
          - name: '查看辅助评阅历史'
            actor: 'STUDENT'
            steps:
              - keyword: GIVEN
                actor: 'STUDENT'
                content: 'student01 有两条评阅记录。'
              - keyword: WHEN
                actor: 'STUDENT'
                content: '学生打开评阅历史。'
              - keyword: THEN
                content: '系统按时间倒序显示两条记录并提供详情入口。'
  - id: MOD-LEDGER
    name: '本地检测台账与统计'
    type: MODULE
    description: '聚合本系统 SQLite 中真实存在的规范检测、相似度检测、规则润色、创新性量表和辅助评阅记录。统计在打开页面、更改筛选条件或点击刷新时重新计算，不承诺无延迟实时流处理。'
    permissions:
      - 'SUPERVISOR'
      - 'COLLEGE_ADMIN'
      - 'SCHOOL_ADMIN'
    dependencies: []
    children:
      - id: FEAT-LEDGER-RECORDS
        name: '按角色数据范围查看台账'
        type: FEATURE
        description: '导师仅查看 supervisor_id 等于当前用户的学生记录；学院管理员仅查看本 college_id；学校管理员查看全部。\n支持按学生、类型、时间范围和最新记录筛选，显示对应类型的核心结果和详情链接。导出内容为当前权限与筛选结果的 UTF-8 CSV。'
        images:
          - label: '全类型检测记录台账'
            path: './reference/image-035.png'
        permissions:
          - 'SUPERVISOR'
          - 'COLLEGE_ADMIN'
          - 'SCHOOL_ADMIN'
        dependencies:
          - 'FEAT-NORMATIVE-REPORT'
          - 'FEAT-DUPLICATION-HISTORY'
          - 'FEAT-POLISH-HISTORY'
          - 'FEAT-INNOVATION-HISTORY'
          - 'FEAT-AI-REVIEW-HISTORY'
        scenarios:
          - name: '导师仅查看名下学生记录'
            actor: 'SUPERVISOR'
            steps:
              - keyword: GIVEN
                actor: 'SUPERVISOR'
                content: 'supervisor01 登录，数据库中同时有名下和非名下学生记录。'
              - keyword: WHEN
                actor: 'SUPERVISOR'
                content: '导师查询台账并导出 CSV。'
              - keyword: THEN
                content: '页面和 CSV 均仅包含 supervisor01 名下学生记录。'
          - name: '拒绝跨范围详情访问'
            actor: 'COLLEGE_ADMIN'
            steps:
              - keyword: GIVEN
                actor: 'COLLEGE_ADMIN'
                content: 'college_admin01 尝试访问 college02 学生的记录 ID。'
              - keyword: WHEN
                actor: 'COLLEGE_ADMIN'
                content: '用户请求详情 API。'
              - keyword: THEN
                content: '后端返回 403，不泄露记录内容。'
      - id: FEAT-LEDGER-FILTERED-STATS
        name: '筛选统计与本地图表'
        type: FEATURE
        description: '根据当前权限和筛选条件计算各类任务的记录数、参与学生数、今日数量和每日趋势。使用本地 SVG/CSS 柱状图和折线图，页面提供手动刷新，不使用外部图表服务。'
        images:
          - label: '检测筛选统计与动态生成图表'
            path: './reference/image-041.png'
        permissions:
          - 'SUPERVISOR'
          - 'COLLEGE_ADMIN'
          - 'SCHOOL_ADMIN'
        dependencies:
          - 'FEAT-LEDGER-RECORDS'
        scenarios:
          - name: '筛选后重算统计'
            actor: 'COLLEGE_ADMIN'
            steps:
              - keyword: GIVEN
                actor: 'COLLEGE_ADMIN'
                content: 'college01 存在多类型、多日期的检测记录。'
              - keyword: WHEN
                actor: 'COLLEGE_ADMIN'
                content: '管理员选择规范检测和指定日期范围。'
              - keyword: THEN
                content: '数据表和图表仅使用该范围的 college01 规范检测记录重算。'
  - id: MOD-QUALITY-PORTRAIT
    name: '本地论文质量仪表盘与画像'
    type: MODULE
    description: '使用本系统已生成的四类可量化结果计算质量指标，不引入新的 AI 判断。所有公式在页面中公开，且可追溯到原始记录。'
    permissions: ALL
    dependencies: []
    children:
      - id: FEAT-QUALITY-DASHBOARD
        name: '群体质量仪表盘'
        type: FEATURE
        description: '规范分=max(0,100-严重错误×10-一般错误×4-轻微错误×1)；原创参考分=100-本地总相似率×100；创新参考分=创新性量表综合分；评阅基础分=辅助评阅客观总分。\n群体页按权限范围和时间、学生、类型筛选，展示样本数、四指标平均分和分布图。某学生缺失某项时显示“暂无数据”，不用 0 分替代。'
        permissions:
          - 'SUPERVISOR'
          - 'COLLEGE_ADMIN'
          - 'SCHOOL_ADMIN'
        dependencies:
          - 'FEAT-LEDGER-FILTERED-STATS'
        scenarios:
          - name: '聚合有效质量指标'
            actor: 'SUPERVISOR'
            steps:
              - keyword: GIVEN
                actor: 'SUPERVISOR'
                content: '名下学生拥有规范、相似度和创新性结果，但暂无辅助评阅。'
              - keyword: WHEN
                actor: 'SUPERVISOR'
                content: '导师打开质量仪表盘。'
              - keyword: THEN
                content: '系统按公式显示三项分数，评阅基础分显示“暂无数据”且不计入平均。'
      - id: FEAT-STUDENT-QUALITY-PORTRAIT
        name: '单学生本地质量画像'
        type: FEATURE
        description: '从每类业务选取该学生最新一条已完成记录，展示四指标卡片、雷达图、原始结果时间和详情链接。\n综合分仅在四项都存在时计算，公式为四项等权平均；否则显示“数据不完整”并列出缺失项。学生仅查看本人，导师和管理员按组织范围查看。'
        images:
          - label: '单学生规范性质量画像'
            path: './reference/image-048.png'
          - label: '单学生论文查重质量画像'
            path: './reference/image-049.png'
          - label: '单学生创新性质量画像'
            path: './reference/image-050.png'
          - label: '单学生 AI 智能评阅质量画像'
            path: './reference/image-051.png'
        permissions: ALL
        dependencies:
          - 'FEAT-QUALITY-DASHBOARD'
        scenarios:
          - name: '四项数据完整时计算综合分'
            actor: 'STUDENT'
            steps:
              - keyword: GIVEN
                actor: 'STUDENT'
                content: 'student01 四项最新指标分别为 80、90、70、80。'
              - keyword: WHEN
                actor: 'STUDENT'
                content: '学生打开本人质量画像。'
              - keyword: THEN
                content: '系统显示四项来源和 80 分综合分。'
          - name: '拒绝学生查看他人画像'
            actor: 'STUDENT'
            steps:
              - keyword: GIVEN
                actor: 'STUDENT'
                content: 'student01 已登录。'
              - keyword: WHEN
                actor: 'STUDENT'
                content: '学生请求另一学生的画像 ID。'
              - keyword: THEN
                content: '后端返回 403，不返回他人指标。'
  - id: MOD-REPORT-INTERACTION
    name: '本地师生报告交互批阅'
    type: MODULE
    description: '学生将本系统内已完成的规范检测、相似度、创新性量表或辅助评阅报告提交给本地组织关系中的导师。\n“推送”指在 SQLite 中创建站内待办，不发送短信、邮件或外部消息。批注绑定报告 finding_id 或作为整体评语，不在 PDF/Word 坐标层上绘制。'
    permissions:
      - 'STUDENT'
      - 'SUPERVISOR'
    dependencies: []
    children:
      - id: FEAT-REPORT-STUDENT-SUBMIT
        name: '学生提交本人报告'
        type: FEATURE
        description: '学生可选择一条或多条已完成且属于本人的报告提交。后端通过当前用户 supervisor_id 确定导师，为每批次创建独立提交记录和站内待办。'
        images:
          - label: '学生报告提交与批阅结果台账'
            path: './reference/image-053.png'
        permissions:
          - 'STUDENT'
        dependencies:
          - 'FEAT-NORMATIVE-REPORT'
          - 'FEAT-DUPLICATION-HISTORY'
          - 'FEAT-INNOVATION-HISTORY'
          - 'FEAT-AI-REVIEW-HISTORY'
        scenarios:
          - name: '提交报告并创建导师待办'
            actor: 'STUDENT'
            steps:
              - keyword: GIVEN
                actor: 'STUDENT'
                content: 'student01 拥有一条已完成报告，本地导师为 supervisor01。'
              - keyword: WHEN
                actor: 'STUDENT'
                content: '学生提交报告。'
              - keyword: THEN
                content: '系统创建状态为已提交待批阅的记录，并为 supervisor01 创建站内待办。'
          - name: '拒绝提交他人报告'
            actor: 'STUDENT'
            steps:
              - keyword: GIVEN
                actor: 'STUDENT'
                content: '报告不属于 student01。'
              - keyword: WHEN
                actor: 'STUDENT'
                content: 'student01 尝试提交该报告 ID。'
              - keyword: THEN
                content: '后端返回 403，不创建提交记录或待办。'
      - id: FEAT-REPORT-SUPERVISOR-QUEUE
        name: '导师站内待批阅任务'
        type: FEATURE
        description: '导师仅查看 assignee_id 为本人的待办，按待批阅优先、提交时间倒序排列，支持按学生、报告类型和状态筛选。红点数量来自未完成待办记录计数。'
        permissions:
          - 'SUPERVISOR'
        dependencies:
          - 'FEAT-REPORT-STUDENT-SUBMIT'
        scenarios:
          - name: '仅显示本导师待办'
            actor: 'SUPERVISOR'
            steps:
              - keyword: GIVEN
                actor: 'SUPERVISOR'
                content: '数据库中有分配给 supervisor01 和其他导师的待办。'
              - keyword: WHEN
                actor: 'SUPERVISOR'
                content: 'supervisor01 打开待批阅中心。'
              - keyword: THEN
                content: '页面和未读计数仅基于 supervisor01 的待办。'
      - id: FEAT-REPORT-SUPERVISOR-REVIEW
        name: '导师在线批阅与反馈'
        type: FEATURE
        description: '导师可打开原报告，对具体 finding_id 添加批注，或添加整体评价和整改建议。提交时必须至少包含一条整体评价，提交后锁定本轮内容、完成待办并将状态改为批阅完成已反馈。'
        images:
          - label: '导师在线交互式报告批阅界面'
            path: './reference/image-054.png'
        permissions:
          - 'SUPERVISOR'
        dependencies:
          - 'FEAT-REPORT-SUPERVISOR-QUEUE'
        scenarios:
          - name: '导师完成本轮批阅'
            actor: 'SUPERVISOR'
            steps:
              - keyword: GIVEN
                actor: 'SUPERVISOR'
                content: 'supervisor01 拥有一条待批阅任务。'
              - keyword: WHEN
                actor: 'SUPERVISOR'
                content: '导师添加一条问题批注和整体评价后提交。'
              - keyword: THEN
                content: '系统锁定批阅内容、完成待办并将提交状态更新为批阅完成已反馈。'
          - name: '拒绝非所属导师批阅'
            actor: 'SUPERVISOR'
            steps:
              - keyword: GIVEN
                actor: 'SUPERVISOR'
                content: '提交记录的 assignee_id 不是 supervisor01。'
              - keyword: WHEN
                actor: 'SUPERVISOR'
                content: 'supervisor01 请求该提交记录或提交批阅。'
              - keyword: THEN
                content: '后端返回 403，不返回报告且不修改状态。'
      - id: FEAT-REPORT-STUDENT-RESULTS
        name: '学生查看批阅结果'
        type: FEATURE
        description: '学生查看本人所有提交轮次，按时间、报告类型和状态筛选。详情页展示原报告、对应 finding 批注、整体评价、整改建议和历史轮次。\n学生首次打开已反馈结果时，状态更新为学生已查阅。支持下载包含报告摘要、批注和评价的 JSON 文件。'
        permissions:
          - 'STUDENT'
        dependencies:
          - 'FEAT-REPORT-SUPERVISOR-REVIEW'
        scenarios:
          - name: '查看反馈并更新已查阅状态'
            actor: 'STUDENT'
            steps:
              - keyword: GIVEN
                actor: 'STUDENT'
                content: 'student01 有一条状态为批阅完成已反馈的提交记录。'
              - keyword: WHEN
                actor: 'STUDENT'
                content: '学生首次打开详情。'
              - keyword: THEN
                content: '页面展示原报告、批注和整体评价，记录状态更新为学生已查阅。'
