name: Rule regressions

on:
  push:
    branches: [main, fix/**]
  pull_request:
  workflow_dispatch:

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Paper Model test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements-paper-compiler.txt pytest
      - name: Run deterministic R09/R10 regression contracts
        env:
          PYTHONPATH: backend:backend/scripts
        run: |
          pytest -q \
            backend/tests_py/test_rule_regression_manifest.py \
            backend/tests_py/test_typo_prompt_chunks.py \
            backend/tests_py/test_fast_local_checks.py

      # The full six-PDF suite is intentionally not run on GitHub-hosted
      # runners: its source archive is 355 MB and is not stored in Git.
      # A self-hosted scheduled job can mount the approved data release and run:
      # RULE_REGRESSION_PDF_ROOT=/mounted/rule-fixtures \
      #   python backend/scripts/run_rule_regression.py
