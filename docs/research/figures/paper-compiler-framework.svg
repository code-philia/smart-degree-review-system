<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#49647c" /></marker><style>text{font-family:Arial,sans-serif;fill:#173047} .title{font-size:30px;font-weight:bold}.section{font-size:20px;font-weight:bold}.label{font-size:19px}.small{font-size:16px}.box{fill:#f0f5fa;stroke:#92a9bd;stroke-width:2;rx:14}.core{fill:#e8f2f2;stroke:#4b8c8a;stroke-width:2;rx:14}.arrow{fill:none;stroke:#49647c;stroke-width:3;marker-end:url(#a)}.feedback{fill:none;stroke:#b76d37;stroke-width:3;marker-end:url(#a)}</style></defs><rect width="1600" height="920" fill="white" /><text x="50" y="75" class="title" font-family="Arial,sans-serif" fill="#173047" font-size="28px" font-weight="bold">Paper as compilable code: rule synthesis and evidence-grounded refinement</text><text x="50" y="98" class="small" font-family="Arial,sans-serif" fill="#173047" font-size="16px">One shared, versioned Paper Model | Per-paper IR | Per-rule generated checking passes</text>
