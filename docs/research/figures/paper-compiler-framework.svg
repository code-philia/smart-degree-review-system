<rect x="45" y="790" width="1505" height="95" fill="#f7f8fa" stroke="#ccd5dd" rx="14" /><text x="70" y="824" class="section" font-family="Arial,sans-serif" fill="#173047" font-size="20px" font-weight="bold">Online mode: freeze = false by default</text><text x="70" y="858" class="label" font-family="Arial,sans-serif" fill="#173047" font-size="19px">New PDF → detect → verify feedback → refine candidate → regress → atomic version promotion</text><text x="1030" y="824" class="small" font-family="Arial,sans-serif" fill="#173047" font-size="16px">freeze = true: fixed-version detection</text><text x="1030" y="856" class="small" font-family="Arial,sans-serif" fill="#173047" font-size="16px">No model / program repair or promotion</text><polygon points="407.0,200.0 396.0,205.0 396.0,195.0" fill="#49647c" /><polygon points="817.0,200.0 806.0,205.0 806.0,195.0" fill="#49647c" /><polygon points="407.0,395.0 396.0,400.0 396.0,390.0" fill="#49647c" /><polygon points="817.0,395.0 806.0,400.0 806.0,390.0" fill="#49647c" /><polygon points="970.0,317.0 965.0,306.0 975.0,306.0" fill="#49647c" /><polygon points="1222.0,395.0 1211.0,400.0 1211.0,390.0" fill="#49647c" /><polygon points="560.0,552.0 555.0,541.0 565.0,541.0" fill="#49647c" /><polygon points="817.0,625.0 806.0,630.0 806.0,620.0" fill="#49647c" /><polygon points="970.0,552.0 965.0,541.0 975.0,541.0" fill="#49647c" /><polygon points="560.0,258.0 565.0,269.0 555.0,269.0" fill="#b76d37" /><polygon points="1222.0,625.0 1211.0,630.0 1211.0,620.0" fill="#49647c" /></svg>