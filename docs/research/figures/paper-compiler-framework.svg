<rect x="45" y="330" width="265" height="130" class="box" fill="#f0f5fa" stroke="#92a9bd" stroke-width="2" rx="14" /><text x="70" y="369" class="section" font-family="Arial,sans-serif" fill="#173047" font-size="20px" font-weight="bold">PDF front end</text><text x="70" y="402" class="label" font-family="Arial,sans-serif" fill="#173047" font-size="19px">Text, layout, structure</text><text x="70" y="432" class="small" font-family="Arial,sans-serif" fill="#173047" font-size="16px">Immutable source + provenance</text>
