# TLS terminates at the campus gateway, which sends X-Forwarded-Proto: https.
map $http_x_forwarded_proto $campus_public_scheme {
    default $scheme;
    https https;
}
map "$host|$campus_public_scheme" $campus_redirect {
    default 1;
    "thesis-review.sjtu.edu.cn|https" 0;
    "127.0.0.1|http" 0;
    "127.0.0.1|https" 0;
    "localhost|http" 0;
    "localhost|https" 0;
}
server {
    listen 3000;
    listen [::]:3000;
    server_name _;
    return 302 https://thesis-review.sjtu.edu.cn$request_uri;
}
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    if ($campus_redirect) { return 302 https://thesis-review.sjtu.edu.cn$request_uri; }
    root /srv/smart-degree/www/current;
    index index.html;
    client_max_body_size 200m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_vary on;
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $campus_public_scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 1200s;
        proxy_send_timeout 1200s;
        proxy_buffering off;
        proxy_request_buffering off;
    }
    location = /index.html { add_header Cache-Control "no-store" always; }
    location ~ \.mjs$ { types { application/javascript mjs; } gzip_static on; expires 1y; try_files $uri =404; }
    location /assets/ { gzip_static on; expires 1y; try_files $uri =404; }
    location / { try_files $uri $uri/ /index.html; }
}
